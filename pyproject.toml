[project]
name = "berlin-reporter"
version = "0.1.0"
description = "MCP server that drafts and submits traffic/parking violation reports to the responsible Berlin authority"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pillow>=10",
    "pillow-heif>=0.16",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
berlin-reporter = "berlin_reporter.server:main"
berlin-reporter-secrets = "berlin_reporter.secrets_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/berlin_reporter"]
